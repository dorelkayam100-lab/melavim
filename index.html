<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מלווים</title>
<meta name="theme-color" content="#1558C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מלווים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1558C0; overflow: hidden; }
  body { padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; display: flex; flex-direction: column; }
  body.ready { background: #FFFFFF; }
  @media (prefers-color-scheme: dark) { body.ready { background: #172028; } }
  iframe { flex: 1; width: 100%; border: 0; display: block; opacity: 0; transition: opacity .25s; }
  body.ready iframe { opacity: 1; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    color: #fff; font: 600 18px/1.4 -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; padding: 24px; transition: opacity .3s; }
  .splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  body.ready .splash { opacity: 0; pointer-events: none; }
  .msg { display: none; max-width: 320px; font-weight: 500; font-size: 16px; }
  .msg button { margin-top: 14px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 12px; background: #fff; color: #1558C0; font: inherit; font-weight: 700; }
  body.slow .msg { display: block; }
  body.slow .spin { display: none; }
</style>
</head>
<body>
<div class="splash" aria-live="polite">
  <img src="icon-180.png" alt="">
  <div>מלווים – הסעות</div>
  <div class="spin" aria-label="טוען"></div>
  <div class="msg" id="msg"></div>
</div>
<iframe id="app" title="מלווים" allow="clipboard-write"></iframe>
<script>
  /* ▼▼▼ כאן מדביקים את הקישור של האפליקציה (זה שמסתיים ב-/exec) ▼▼▼ */
var APP_URL = 'https://script.google.com/macros/s/.../exec';
  /* ▲▲▲ ▲▲▲ */

  var frame = document.getElementById('app');
  var msg = document.getElementById('msg');
  function slow(text) {
    msg.innerHTML = text + '<br><button onclick="location.reload()">לנסות שוב</button>';
    document.body.classList.add('slow');
  }
  if (APP_URL.indexOf('/exec') < 0) {
    slow('עוד לא הוגדר הקישור של האפליקציה בקובץ index.html.');
  } else if (!navigator.onLine) {
    slow('אין חיבור לאינטרנט. כשהחיבור יחזור, לוחצים על "לנסות שוב".');
  } else {
    frame.onload = function () { document.body.classList.add('ready'); };
    frame.src = APP_URL;
    setTimeout(function () {
      if (!document.body.classList.contains('ready')) slow('הטעינה לוקחת יותר זמן מהרגיל. כדאי לבדוק את החיבור לאינטרנט.');
    }, 25000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
